<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DharoharGrid — Discover</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Discover is a bundled React app loaded as an ES module — browsers
      // refuse to load `type="module"` scripts over file://, which leaves
      // #root permanently empty (a blank white screen) with no error unless
      // devtools happen to be open. Every other page in this project is a
      // plain classic script and works fine double-clicked; this one needs
      // an actual HTTP server. Catch it here with a plain (non-module, so
      // it still runs over file://) script and say so instead of just
      // showing nothing.
      if (window.location.protocol === "file:") {
        document.getElementById("root").innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
          'background:#050507;color:#fff;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;' +
          'text-align:center;padding:2rem;">' +
          '<div style="max-width:480px;">' +
          '<h1 style="font-size:1.1rem;letter-spacing:0.05em;margin-bottom:1rem;">' +
          'This page needs a local server</h1>' +
          '<p style="color:#9ca3af;line-height:1.6;font-size:0.9rem;">' +
          "Discover is a bundled app and browsers won't load it opened " +
          "directly as a file. Serve the project over HTTP instead — e.g. " +
          "<code style=\"background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;\">" +
          "python -m http.server</code> from the repository root — then open " +
          "this page as <code style=\"background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;\">" +
          "http://localhost:&lt;port&gt;/Discover/dist/index.html</code>." +
          "</p></div></div>";
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
